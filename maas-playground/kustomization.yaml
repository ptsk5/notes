apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/route.yaml

images:
  - name: '*'
    newName: quay.io/client-engineering-cee/maas/maas-playground
    newTag: v1.0.0
labels:
  - includeSelectors: true
    pairs:
      app: maas-playground