apiVersion: apps/v1
kind: Deployment
metadata:
  # trivy:ignore:KSV-0110
  # trivy:ignore:AVD-KSV-0110
  name: maas-playground
  labels:
    app: maas-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-playground
  template:
    metadata:
      labels:
        app: maas-playground
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maas-playground
          image: ''
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
